<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- PDF Viewer app icon, small variant for 16-24 px: the pen of assets/app_icon.svg is left
       out (it turns to noise below 32 px) and the page and its lines are larger and bolder.
       The shapes sit on the 16 px grid (32 units a pixel). Original project art, MIT. -->
  <title>PDF Viewer</title>
  <rect width="512" height="512" rx="112" fill="#c8102e"/>
  <path d="M128 80h160l96 96v256H128z" fill="#fff"/>
  <path d="M288 80v96h96z" fill="#f4c3cb"/>
  <rect x="192" y="224" width="128" height="32" fill="#c8102e"/>
  <rect x="192" y="288" width="128" height="32" fill="#c8102e"/>
  <rect x="192" y="352" width="96" height="32" fill="#c8102e"/>
</svg>
