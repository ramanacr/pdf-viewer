<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Viewer Native: web demo</title>
    <meta name="description" content="A PDF viewer whose own C# engine runs in your browser as WebAssembly. Files never leave your device." />
    <meta name="color-scheme" content="light dark" />
    <!-- No third-party requests: everything below is served from this site. A <meta> policy cannot
         set frame-ancestors: when you host the viewer, send it as a header (docs/sdk, "Who can frame the viewer"). -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <meta name="referrer" content="no-referrer" />
    <base href="/" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/app.css" />
    <script src="js/theme.js"></script>
</head>
<body>
    <div id="app">
        <div class="boot" role="status">
            <svg class="boot-mark" viewBox="0 0 64 64" width="56" height="56" aria-hidden="true"><rect x="12" y="6" width="40" height="52" rx="5" fill="none" stroke="currentColor" stroke-width="3"/><path d="M21 22h22M21 31h22M21 40h14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
            <h1>PDF Viewer <span class="brand-tag">web demo</span></h1>
            <p>Loading the PDF engine into this tab&hellip; <span id="boot-progress"></span></p>
            <div class="boot-bar"><div class="boot-bar-fill"></div></div>
            <p class="muted">Files you open are never uploaded. No analytics, no cookies.</p>
            <noscript><p>This viewer runs the PDF engine in your browser and needs JavaScript and WebAssembly.</p></noscript>
        </div>
    </div>

    <div id="blazor-error-ui" role="alert">
        Something went wrong in the viewer. <a href="" class="reload">Reload</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
