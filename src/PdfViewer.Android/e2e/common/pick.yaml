# In Android's document picker (DocumentsUI): browse to Documents > pdfviewer-e2e and tap ${FILE}.
# The picker hides the device's storage until "Show internal storage" is chosen in its ⋮ menu.
appId: io.github.ramanacr.pdfviewer
---
- extendedWaitUntil: { visible: "(?i).*(Show roots|Open from).*", timeout: 120000 }
- tapOn: "More options"
- runFlow:
    when: { visible: "Show internal storage" }
    commands:
      - tapOn: "Show internal storage"
- runFlow:
    when: { notVisible: "Show internal storage" }
    commands:
      - pressKey: back
- tapOn: "Show roots"
- tapOn: "Android SDK built for x86_64"
- tapOn: "Documents"
- tapOn: "pdfviewer-e2e"
- extendedWaitUntil: { visible: "${FILE}", timeout: 60000 }
- tapOn: "${FILE}"
