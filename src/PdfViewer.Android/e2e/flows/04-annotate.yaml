# doc: sample
appId: io.github.ramanacr.pdfviewer
---
- extendedWaitUntil: { visible: "1 / 7", timeout: 90000 }
- tapOn: "✎"
- tapOn: "Note"
- tapOn: { point: "50%, 45%" }
- extendedWaitUntil: { visible: "New note", timeout: 30000 }
- inputText: "Check this"
- tapOn: "(?i)^ok$"
- tapOn: "Rectangle"
- swipe: { start: "30%, 60%", end: "60%, 70%", duration: 800 }
# Undo and Redo are at the end of the annotate bar: scroll it first.
- repeat:
    times: 6
    while: { notVisible: "↶" }
    commands:
      - swipe: { start: "90%, 15%", end: "10%, 15%", duration: 1500 }
- tapOn: "↶"
- tapOn: "↷"
- tapOn: "⋮"
- tapOn: "Comments"
- tapOn: "Annotation list"
- extendedWaitUntil: { visible: ".*Check this.*", timeout: 30000 }
