# doc: sample
appId: io.github.ramanacr.pdfviewer
---
- extendedWaitUntil: { visible: "1 / 7", timeout: 90000 }
- runFlow: { file: ../common/tool.yaml, env: { TOOL: "Reduce file size" } }
- tapOn: "(?i)^reduce$"
- extendedWaitUntil: { visible: "(?i)smaller copy ready|already compact", timeout: 180000 }
