name: Web Demo (Blazor WebAssembly)

# Builds the browser demo (src/PdfViewer.Web) on every pull request and push to main, and from
# main deploys the whole GitHub Pages site: the documentation in docs/ (home page, privacy policy)
# at the root, built with Jekyll, the demo under /demo/, and the API reference of the engine
# packages (docfx, eng/apidocs) under /api/.
#
# The deploy job runs when Settings > Pages > Source is "GitHub Actions" and the repository
# variable WEB_DEMO_PAGES is true; otherwise the workflow only builds and checks the site.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A newer push makes an unfinished build redundant.
    concurrency:
      group: web-demo-build-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 30

    steps:
    - name: Checkout Repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0   # the version comes from the latest release tag (Directory.Build.props)

    - name: Setup .NET 9.0 SDK
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: '9.0.x'

    # The runner image also has a newer SDK, which would be chosen by default and asks for a
    # different workload (wasm-tools-net9). Pin this job to the 9.0 SDK installed above.
    - name: Pin the .NET 9 SDK
      shell: bash
      run: |
        sdk=$(dotnet --list-sdks | awk '/^9\./ {print $1}' | sort -V | tail -1)
        test -n "$sdk"
        echo "{ \"sdk\": { \"version\": \"$sdk\", \"rollForward\": \"latestPatch\" } }" > global.json
        dotnet --version

    # Skia's native library is linked into the WebAssembly runtime, which needs Emscripten.
    - name: Install the wasm-tools workload
      run: dotnet workload install wasm-tools

    - name: Publish
      run: dotnet publish src/PdfViewer.Web/PdfViewer.Web.csproj --configuration Release --output publish/web

    # The embed SDK (docs/sdk) is two plain scripts next to the viewer, with no build step.
    - name: Check the embed SDK scripts
      run: |
        node --check publish/web/wwwroot/pdfviewer-embed.js
        node --check publish/web/wwwroot/pdfviewer-embed.mjs
        node --check docs/sdk/examples/large-pdf.js
        node --check eng/webdemo/serve.mjs
        node --test tests/sdk/embed-range.test.mjs tests/sdk/embed-fonts.test.mjs

    # Noto fonts for the scripts that the committed Liberation fonts lack (Arabic, Hebrew, Indic,
    # Sinhala, Thai, symbols, math, CJK). They are not committed: eng/webdemo/noto_fonts.py downloads
    # the release archives pinned in eng/webdemo/noto-fonts.json (github.com/notofonts only), checks
    # the size and SHA-256 of each archive and the SHA-256 of each file taken from it (a mismatch
    # fails the build), cuts the CJK faces into Unicode slices with the pinned fontTools, and writes
    # them with their licences to fonts/noto. index.json maps code points to files and gives each
    # file's size and SHA-256, which the app checks after each fetch. The app fetches a file from
    # this site only when a page needs a glyph from it. Cached archives are checked again.
    - name: Cache the Noto archives
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/noto-fonts
        key: noto-fonts-${{ hashFiles('eng/webdemo/noto-fonts.json') }}

    - name: Add the Noto fonts
      shell: bash
      run: |
        python3 -I eng/webdemo/noto_fonts.py check
        python3 -m venv "$RUNNER_TEMP/noto-venv"
        py="$RUNNER_TEMP/noto-venv/bin/python"
        python3 -I eng/webdemo/noto_fonts.py requirements > "$RUNNER_TEMP/noto-requirements.txt"
        "$py" -m pip install --quiet --disable-pip-version-check --require-hashes --no-deps -r "$RUNNER_TEMP/noto-requirements.txt"
        "$py" -I eng/webdemo/noto_fonts.py build --cache ~/.cache/noto-fonts --out publish/web/wwwroot/fonts/noto --summary "$GITHUB_STEP_SUMMARY"
        test -s publish/web/wwwroot/fonts/noto/index.json
        test -s publish/web/wwwroot/fonts/noto/NotoSansArabic-Regular.ttf
        test -s publish/web/wwwroot/fonts/noto/NotoSansSC-Regular-00.otf
        test -s publish/web/wwwroot/fonts/noto/NotoSansThai-Regular.ttf
        test -s publish/web/wwwroot/fonts/noto/NotoSansSinhala-Regular.ttf
        test -s publish/web/wwwroot/fonts/noto/OFL-thai.txt
        # Every file in the index has its size and SHA-256, and the files on disk match them.
        python3 -I - publish/web/wwwroot/fonts/noto <<'PY'
        import hashlib, json, os, sys
        folder = sys.argv[1]
        faces = json.load(open(os.path.join(folder, "index.json"), encoding="utf-8"))["faces"]
        for face in faces:
            data = open(os.path.join(folder, face["file"]), "rb").read()
            assert face["size"] == len(data) and face["sha256"] == hashlib.sha256(data).hexdigest(), face["file"]
        print(f"index.json: {len(faces)} files, each with a matching size and SHA-256")
        PY
        # The About dialog links the licence of every source (Viewer.razor.cs, FontNotices).
        for id in $(python3 -I -c 'import json; print(" ".join(f["id"] for f in json.load(open("eng/webdemo/noto-fonts.json"))["fonts"]))'); do
          test -s "publish/web/wwwroot/fonts/noto/OFL-$id.txt"
          grep -q "fonts/noto/OFL-$id.txt" src/PdfViewer.Web/Components/Viewer.razor.cs || { echo "::error::Viewer.razor.cs FontNotices lacks OFL-$id.txt"; exit 1; }
        done
        # The first load fetches no font: the page and the runtime's boot list name none.
        if grep -q 'fonts/' publish/web/wwwroot/index.html || grep -rqs --include='*.json' -e '\.ttf' -e '\.otf' publish/web/wwwroot/_framework; then
          echo "::error::index.html or the boot list names a font file: fonts must load only when a page needs them"
          exit 1
        fi

    # A project site is served under /<repository>/: the app's base href must say so. The
    # precompressed copies are dropped: GitHub Pages compresses by itself and never serves them.
    - name: Prepare the site for GitHub Pages
      shell: bash
      run: |
        site=publish/web/wwwroot
        base="/${GITHUB_REPOSITORY#*/}/demo/"
        sed -i "s|<base href=\"/\" />|<base href=\"$base\" />|" "$site/index.html"
        grep -q "<base href=\"$base\" />" "$site/index.html"
        find "$site" -name '*.br' -delete
        find "$site" -name '*.gz' -delete
        touch "$site/.nojekyll"
        {
          echo "### Web demo"
          echo "Base href: \`$base\`"
          echo ""
          echo "| | Size |"
          echo "|---|---|"
          echo "| Site (uncompressed) | $(du -sh --apparent-size "$site" | cut -f1) |"
          echo "| Runtime with Skia (dotnet.native.wasm) | $(du -h --apparent-size "$site"/_framework/dotnet.native.*.wasm | cut -f1) |"
          echo "| Engine (PdfEngine.Vector.wasm) | $(du -h --apparent-size "$site"/_framework/PdfEngine.Vector.*.wasm | cut -f1) |"
          echo "| App without the fonts, gzip-compressed (about what a first visit transfers) | $(tar -C "$site" --exclude=./fonts -cf - . | gzip -6 | wc -c | numfmt --to=iec) |"
          echo "| Liberation fonts (fetched only when a page needs a face) | $(du -sh --apparent-size --exclude=noto "$site/fonts" | cut -f1) |"
          echo "| Noto fonts (fetched only when a page needs a glyph from a file) | $(du -sh --apparent-size "$site/fonts/noto" | cut -f1) |"
        } | tee -a "$GITHUB_STEP_SUMMARY"

    # Pages serves only what this workflow deploys, so the documentation site in docs/ (home page,
    # privacy policy) is built here too and kept at the site root; the demo goes under /demo/.
    # The whole site is also built and checked on pull requests, so that a broken layout or page
    # fails the check; only the deploy is kept for main.
    - name: Build the documentation site
      uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
      with:
        source: ./docs
        destination: ./publish/pages

    - name: Put the demo under /demo/
      shell: bash
      run: |
        sudo chown -R "$(id -u)":"$(id -g)" publish/pages
        test -f publish/pages/index.html
        test -f publish/pages/privacy/index.html
        test -f publish/pages/getting-started/index.html
        test -f publish/pages/features/index.html
        test -f publish/pages/developers/index.html
        test -s publish/pages/assets/css/site.css
        test -s publish/pages/assets/js/site.js
        grep -q 'assets/css/site.css' publish/pages/index.html
        grep -q 'class="docs-sidebar"' publish/pages/features/index.html
        mkdir -p publish/pages/demo
        cp -r publish/web/wwwroot/. publish/pages/demo/
        touch publish/pages/.nojekyll

    # Subresource Integrity (SRI) hashes of the SDK scripts as deployed, for pages that load them
    # with integrity="sha384-...": /demo/pdfviewer-embed.integrity.json and the step summary.
    - name: Write the SRI hashes of the embed SDK
      shell: bash
      run: |
        cd publish/pages/demo
        js="sha384-$(openssl dgst -sha384 -binary pdfviewer-embed.js | openssl base64 -A)"
        mjs="sha384-$(openssl dgst -sha384 -binary pdfviewer-embed.mjs | openssl base64 -A)"
        printf '{\n  "pdfviewer-embed.js": "%s",\n  "pdfviewer-embed.mjs": "%s"\n}\n' "$js" "$mjs" > pdfviewer-embed.integrity.json
        python3 -I -c 'import json, sys; json.load(open(sys.argv[1]))' pdfviewer-embed.integrity.json
        {
          echo "### Embed SDK integrity"
          echo "| File | integrity |"
          echo "|---|---|"
          echo "| pdfviewer-embed.js | \`$js\` |"
          echo "| pdfviewer-embed.mjs | \`$mjs\` |"
        } >> "$GITHUB_STEP_SUMMARY"

    # The SDK script is served from /demo/ next to the viewer, its default baseUrl; Jekyll copies
    # the documentation and the examples (docs/sdk) to /sdk/.
    - name: Check the embed SDK pages
      shell: bash
      run: |
        test -f publish/pages/demo/pdfviewer-embed.js
        test -s publish/pages/demo/pdfviewer-embed.integrity.json
        test -f publish/pages/sdk/index.html
        test -f publish/pages/sdk/examples/index.html
        test -f publish/pages/sdk/examples/sample-pdf.js

    # The API reference of the engine packages (eng/apidocs), built with docfx, the version pinned in
    # .config/dotnet-tools.json. It is built on pull requests too, so that a broken reference fails
    # the check; docfx exits with an error code when it reports errors. It goes under /api/ after the
    # Jekyll build, so Jekyll never processes it. Source maps of the template are dropped.
    - name: Build the API reference
      shell: bash
      run: |
        dotnet tool restore
        dotnet docfx eng/apidocs/docfx.json
        test -f eng/apidocs/_site/index.html
        test -f eng/apidocs/_site/reference/PdfEngine.Vector.Document.PdfVectorDocument.html
        find eng/apidocs/_site -name '*.map' -delete
        echo "API reference: $(du -sh --apparent-size eng/apidocs/_site | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

    - name: Put the API reference under /api/
      shell: bash
      run: |
        mkdir -p publish/pages/api
        cp -r eng/apidocs/_site/. publish/pages/api/
        test -f publish/pages/api/index.html
        test -f publish/pages/api/public/main.css

    # On a pull request, the built site is kept for a few days so that reviewers can look at it
    # (download it, serve the folder under /pdf-viewer/). It is never deployed.
    - name: Upload the site for review
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: site-preview
        path: publish/pages
        retention-days: 5
        include-hidden-files: true

    - name: Upload the Pages artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
      with:
        path: publish/pages

  deploy:
    needs: build
    # Only from main, and only after the owner switched Pages to GitHub Actions (see the top).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WEB_DEMO_PAGES == 'true'
    runs-on: ubuntu-latest
    # Deployments queue and are never cancelled: a half-finished one can leave Pages inconsistent.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
