name: Engine Packages

# Packs the engine libraries (PdfEngine.Abstractions, PdfEngine.Vector, PdfEngine.Vector.Skia) as
# NuGet packages and keeps them as a build artifact. Nothing is published on pull requests or
# pushes to main.
#
# Publishing to nuget.org happens only for an engine tag (engine-v0.1.0 gives version 0.1.0) or a
# manual run with "publish" set, through nuget.org Trusted Publishing (no stored API key), and
# only once the NUGET_USER repository variable is set; until then the publish job is skipped.
# The app's release tags (v*) do not start this
# workflow, and engine tags do not start the app release (release.yml).
on:
  push:
    branches: [ "main" ]
    tags: [ "engine-v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (e.g. 0.1.0-preview.1). Empty: 0.0.0-ci.<run number>."
        required: false
        default: ""
      publish:
        description: "Push the packages to nuget.org (Trusted Publishing; needs the NUGET_USER variable)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pack:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0 # SourceLink and the assembly version read the git history

    - name: Setup .NET 9.0 SDK
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: '9.0.x'

    - name: Choose the package version
      id: version
      shell: pwsh
      env:
        INPUT_VERSION: ${{ github.event.inputs.version }}
      run: |
        if ($env:GITHUB_REF -like 'refs/tags/engine-v*') { $version = $env:GITHUB_REF_NAME.Substring('engine-v'.Length) }
        elseif ("$env:INPUT_VERSION".Trim()) { $version = "$env:INPUT_VERSION".Trim() }
        else { $version = "0.0.0-ci.$env:GITHUB_RUN_NUMBER" }
        # SemVer 2.0: major.minor.patch with an optional pre-release label.
        if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') { throw "'$version' is not a package version (e.g. 0.1.0 or 0.1.0-preview.1)." }
        "version=$version" >> $env:GITHUB_OUTPUT
        Write-Host "Package version: $version"

    - name: Pack
      shell: pwsh
      run: |
        foreach ($project in "PdfEngine.Abstractions", "PdfEngine.Vector", "PdfEngine.Vector.Skia") {
          dotnet pack "src/$project/$project.csproj" --configuration Release --output artifacts/packages "-p:PdfEngineVersion=${{ steps.version.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        Get-ChildItem artifacts/packages | ForEach-Object { "$($_.Name) ($($_.Length) bytes)" }

    - name: Upload Packages
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: engine-packages-${{ steps.version.outputs.version }}
        path: |
          artifacts/packages/*.nupkg
          artifacts/packages/*.snupkg
        if-no-files-found: error

  # Packs again from the same commit with the same version (the build is deterministic) and pushes.
  # Trusted Publishing: no long-lived API key is stored anywhere. The job asks GitHub for an OIDC
  # token, NuGet/login exchanges it at nuget.org for an API key valid about an hour, and nuget.org
  # accepts it only for the trust policy the owner set up there (this repository, this workflow
  # file, the "nuget" environment). The job is skipped until the NUGET_USER repository variable
  # (the nuget.org user name that owns the policy) is set.
  publish:
    needs: pack
    if: (startsWith(github.ref, 'refs/tags/engine-v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')) && vars.NUGET_USER != ''
    runs-on: windows-latest
    environment: nuget # add required reviewers in Settings > Environments to approve every publish
    permissions:
      contents: read
      id-token: write # the OIDC token for the nuget.org login, and nothing else

    steps:
    - name: Checkout Repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0

    - name: Setup .NET 9.0 SDK
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: '9.0.x'

    - name: Pack
      shell: pwsh
      run: |
        foreach ($project in "PdfEngine.Abstractions", "PdfEngine.Vector", "PdfEngine.Vector.Skia") {
          dotnet pack "src/$project/$project.csproj" --configuration Release --output artifacts/packages "-p:PdfEngineVersion=${{ needs.pack.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Log in to nuget.org (Trusted Publishing)
      id: login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ vars.NUGET_USER }}

    - name: Push to nuget.org
      shell: pwsh
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: |
        # The .snupkg next to each .nupkg goes to the symbol server in the same push.
        foreach ($package in Get-ChildItem artifacts/packages -Filter *.nupkg) {
          dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
