name: Engine Packages

# Packs the engine libraries (PdfEngine.Abstractions, PdfEngine.Vector, PdfEngine.Vector.Skia) as
# NuGet packages and keeps them as a build artifact. Nothing is published on pull requests or
# pushes to main.
#
# Publishing to nuget.org happens only for an engine tag (engine-v0.1.0 gives version 0.1.0) or a
# manual run with "publish" set, and only when the NUGET_API_KEY secret exists. Without the secret
# the publish job writes a notice and stops. The app's release tags (v*) do not start this
# workflow, and engine tags do not start the app release (release.yml).
on:
  push:
    branches: [ "main" ]
    tags: [ "engine-v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (e.g. 0.1.0-preview.1). Empty: 0.0.0-ci.<run number>."
        required: false
        default: ""
      publish:
        description: "Push the packages to nuget.org (needs the NUGET_API_KEY secret)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pack:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0 # SourceLink and the assembly version read the git history

    - name: Setup .NET 9.0 SDK
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: '9.0.x'

    - name: Choose the package version
      id: version
      shell: pwsh
      env:
        INPUT_VERSION: ${{ github.event.inputs.version }}
      run: |
        if ($env:GITHUB_REF -like 'refs/tags/engine-v*') { $version = $env:GITHUB_REF_NAME.Substring('engine-v'.Length) }
        elseif ("$env:INPUT_VERSION".Trim()) { $version = "$env:INPUT_VERSION".Trim() }
        else { $version = "0.0.0-ci.$env:GITHUB_RUN_NUMBER" }
        # SemVer 2.0: major.minor.patch with an optional pre-release label.
        if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') { throw "'$version' is not a package version (e.g. 0.1.0 or 0.1.0-preview.1)." }
        "version=$version" >> $env:GITHUB_OUTPUT
        Write-Host "Package version: $version"

    - name: Pack
      shell: pwsh
      run: |
        foreach ($project in "PdfEngine.Abstractions", "PdfEngine.Vector", "PdfEngine.Vector.Skia") {
          dotnet pack "src/$project/$project.csproj" --configuration Release --output artifacts/packages "-p:PdfEngineVersion=${{ steps.version.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        Get-ChildItem artifacts/packages | ForEach-Object { "$($_.Name) ($($_.Length) bytes)" }

    - name: Upload Packages
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: engine-packages-${{ steps.version.outputs.version }}
        path: |
          artifacts/packages/*.nupkg
          artifacts/packages/*.snupkg
        if-no-files-found: error

  # Packs again from the same commit with the same version (the build is deterministic) and pushes.
  # It does not download the pack job's artifact, so it needs no action beyond the pinned ones above.
  publish:
    needs: pack
    if: startsWith(github.ref, 'refs/tags/engine-v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    runs-on: windows-latest

    steps:
    - name: Check for the NuGet API key
      id: key
      shell: pwsh
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
          Write-Host "::notice::The NUGET_API_KEY secret is not set, so nothing is published."
          "present=false" >> $env:GITHUB_OUTPUT
        } else {
          "present=true" >> $env:GITHUB_OUTPUT
        }

    - name: Checkout Repository
      if: steps.key.outputs.present == 'true'
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0

    - name: Setup .NET 9.0 SDK
      if: steps.key.outputs.present == 'true'
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: '9.0.x'

    - name: Pack and push to nuget.org
      if: steps.key.outputs.present == 'true'
      shell: pwsh
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        foreach ($project in "PdfEngine.Abstractions", "PdfEngine.Vector", "PdfEngine.Vector.Skia") {
          dotnet pack "src/$project/$project.csproj" --configuration Release --output artifacts/packages "-p:PdfEngineVersion=${{ needs.pack.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        # The .snupkg next to each .nupkg goes to the symbol server in the same push.
        foreach ($package in Get-ChildItem artifacts/packages -Filter *.nupkg) {
          dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
