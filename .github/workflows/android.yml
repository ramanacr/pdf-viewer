name: Android (proof of concept)

# Builds the Android viewer (src/PdfViewer.Android) and uploads the APK as an artifact. A separate
# workflow so the main CI job is not slowed down; it runs only when the app or the code it is built
# from changes. The APK is signed with the runner's throwaway debug key (no keystore in the
# repository): install it with `adb install`, it is not a store release. The signed store release
# is .github/workflows/android-release.yml (docs/android-release.md).

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/PdfViewer.Android/**"
      - "src/PdfViewer.Web.Engine/**"
      - "src/PdfEngine.Vector/**"
      - "src/PdfEngine.Vector.Skia/**"
      - "src/PdfEngine.Abstractions/**"
      - "Directory.Build.props"
      - ".github/workflows/android.yml"
      - "fastlane/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/PdfViewer.Android/**"
      - "src/PdfViewer.Web.Engine/**"
      - "src/PdfEngine.Vector/**"
      - "src/PdfEngine.Vector.Skia/**"
      - "src/PdfEngine.Abstractions/**"
      - "Directory.Build.props"
      - ".github/workflows/android.yml"
      - ".github/workflows/android-release.yml"
      - "fastlane/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Ubuntu runners come with the Android SDK and JDKs installed.
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    - name: Checkout Repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0   # the version comes from the latest release tag (Directory.Build.props)

    - name: Setup .NET 10.0 SDK
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: '10.0.x'

    # The app is net10.0-android (API level 36, Google Play's target API level). Pin SDK 10, so that
    # its android workload is the one installed and used.
    - name: Pin the .NET 10 SDK
      shell: bash
      run: |
        sdk=$(dotnet --list-sdks | awk '/^10\./ {print $1}' | sort -V | tail -1)
        test -n "$sdk"
        echo "{ \"sdk\": { \"version\": \"$sdk\", \"rollForward\": \"latestPatch\" } }" > global.json
        dotnet --version

    - name: Install the android workload
      run: dotnet workload install android

    # Release builds an app bundle by default; the test artifact is an APK to install with adb.
    - name: Build the APK
      shell: bash
      run: |
        dotnet build src/PdfViewer.Android/PdfViewer.Android.csproj -f net10.0-android -c Release \
          -p:AndroidPackageFormat=apk \
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" -p:JavaSdkDirectory="$JAVA_HOME_21_X64"

    - name: Check the package and the store listing
      shell: bash
      run: |
        apk=$(ls src/PdfViewer.Android/bin/Release/net10.0-android/*-Signed.apk)
        manifest=src/PdfViewer.Android/obj/Release/net10.0-android/android/AndroidManifest.xml
        # The app asks for no permission at all: no INTERNET, no storage.
        if grep -q "uses-permission" "$manifest"; then grep "uses-permission" "$manifest"; exit 1; fi
        # Google Play's target API level for new apps and updates (docs/android-release.md).
        grep -q 'android:targetSdkVersion="36"' "$manifest" || { grep "uses-sdk" "$manifest"; exit 1; }
        # The listing text that Google Play and F-Droid read, within the stores' limits.
        meta=fastlane/metadata/android/en-US
        check() {
          n=$(tr -d '\n' < "$1" | wc -m)
          if [ "$n" -gt "$2" ]; then echo "::error::$1 has $n characters, more than $2"; exit 1; fi
        }
        check "$meta/title.txt" 30
        check "$meta/short_description.txt" 80
        check "$meta/full_description.txt" 4000
        for f in "$meta"/changelogs/*.txt; do check "$f" 500; done
        {
          echo "### Android APK"
          echo "| | |"
          echo "|---|---|"
          echo "| APK (arm64 and x86-64) | $(du -h --apparent-size "$apk" | cut -f1) |"
          echo "| Permissions | none |"
          echo "| Target API level | 36 |"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload the APK
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: pdf-viewer-android-apk
        path: src/PdfViewer.Android/bin/Release/net10.0-android/*-Signed.apk
        if-no-files-found: error
        retention-days: 14

    # The Play bundle must carry the native debug symbols (NativeDebugSymbols.targets), or Play Console
    # warns that the bundle has native code without debug symbols. Same build, as an .aab signed with
    # the runner's debug key; the store bundle is built by android-release.yml.
    - name: Build the app bundle and check its native debug symbols
      shell: bash
      run: |
        dotnet build src/PdfViewer.Android/PdfViewer.Android.csproj -f net10.0-android -c Release \
          -p:AndroidPackageFormat=aab \
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" -p:JavaSdkDirectory="$JAVA_HOME_21_X64"
        aab=$(ls src/PdfViewer.Android/bin/Release/net10.0-android/*-Signed.aab)
        unzip -l "$aab" | grep -E "base/lib/|BUNDLE-METADATA/" | tee "$RUNNER_TEMP/aab-list.txt"
        dir=BUNDLE-METADATA/com.android.tools.build.debugsymbols
        for abi in arm64-v8a x86_64; do
          for f in libmonodroid.so.sym libxamarin-app.so.dbg; do
            grep -q " $dir/$abi/$f\$" "$RUNNER_TEMP/aab-list.txt" || { echo "::error::$dir/$abi/$f is missing from the bundle"; exit 1; }
          done
        done
        {
          echo "### Native debug symbols in the app bundle"
          echo '```'
          grep "$dir/" "$RUNNER_TEMP/aab-list.txt"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
