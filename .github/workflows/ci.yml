name: CI Build, Test & Security Matrix

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  schedule:
    # Nightly tier (07_TEST_CORPUS "CI tiers"): deep fuzzing and the corpus report.
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET 9.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore Dependencies
      run: dotnet restore PdfViewer.slnx

    - name: Build Solution (Debug & Release)
      run: |
        dotnet build PdfViewer.slnx --configuration Debug --no-restore
        dotnet build PdfViewer.slnx --configuration Release --no-restore

    - name: Run Viewer Regression Suite & Code Coverage
      run: dotnet test tests/PdfViewer.Tests/PdfViewer.Tests.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

    # Vector engine: unit, fixture, differential (PDFium oracle) and fuzz-regression tests.
    - name: Run Vector Engine Suite
      env:
        VECTOR_FUZZ_ITERATIONS: ${{ github.event_name == 'schedule' && '100000' || '2000' }}
      run: dotnet test tests/PdfEngine.Vector.Tests/PdfEngine.Vector.Tests.csproj --configuration Release --no-build --verbosity normal

    # Local-only corpus report (no document leaves the runner). Extend by pointing at a
    # rights-cleared corpus checkout; see eng/vectorpdf/corpus/README.md.
    - name: Vector Corpus Report
      shell: pwsh
      run: |
        dotnet run --project eng/vectorpdf/tools/VectorPdf.Tool/VectorPdf.Tool.csproj --configuration Release --no-build -- corpus samples --out vector-corpus.jsonl --diff
        Get-Content vector-corpus.jsonl

    - name: Vector vs PDFium Benchmarks
      run: dotnet run --project eng/vectorpdf/tools/VectorPdf.Tool/VectorPdf.Tool.csproj --configuration Release --no-build -- bench --pages 10

    - name: Upload Vector Diagnostics
      uses: actions/upload-artifact@v4
      with:
        name: vector-diagnostics
        path: vector-corpus.jsonl

    - name: Run Performance Benchmarks
      run: dotnet run --project benchmarks/PdfViewer.Benchmarks/PdfViewer.Benchmarks.csproj --configuration Release --no-build

    - name: Generate CycloneDX & SPDX SBOMs
      shell: pwsh
      run: ./scripts/generate_sbom.ps1

    # Code signing (eng/signing/README.md): a throwaway self-signed certificate for this run, so
    # every build exercises the signing and verification path. Releases sign with the owner's key.
    - name: Create a throwaway signing certificate
      shell: pwsh
      run: |
        $dir = Join-Path $env:RUNNER_TEMP "signing"
        ./scripts/new_signing_certificate.ps1 -OutputDir $dir -Subject "CN=PDF Viewer CI (throwaway)" -ValidYears 1 -PlainPasswordFile
        "PDFVIEWER_SIGN_PFX=$(Join-Path $dir 'codesign.pfx')" >> $env:GITHUB_ENV

    - name: Verify Release Packaging Script
      id: publish
      shell: pwsh
      run: ./scripts/build_publish.ps1 -DryRun

    # Release gates on the payload the step above staged in publish/app (eng/releasegate/README.md).
    # Both run whenever the publish succeeded, so one failing does not hide the other's numbers.
    - name: Installer Payload Size Gate
      if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
      shell: pwsh
      run: dotnet run --project eng/releasegate/ReleaseGate.Tool/ReleaseGate.Tool.csproj --configuration Release --no-build -- payload --dir publish/app --baseline eng/releasegate/baseline-payload.json --check --out payload-size.json

    - name: Cold-Start Gate
      if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
      shell: pwsh
      run: dotnet run --project eng/releasegate/ReleaseGate.Tool/ReleaseGate.Tool.csproj --configuration Release --no-build -- startup --app publish/app --environment "github windows-latest" --baseline eng/releasegate/baseline-startup.json --check --out startup-timings.json

    - name: Upload Release Gate Measurements
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: release-gates
        path: |
          payload-size.json
          startup-timings.json
        if-no-files-found: ignore

  # Nightly (and on demand): the rights-cleared corpus (eng/vectorpdf/corpus) against the committed
  # baseline. Files are fetched at pinned commits and hash-verified; nothing is committed and no
  # document leaves the runner. Runners have no GPU, so the baseline is the WARP one.
  corpus:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 9.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Cache Corpus
      uses: actions/cache@v4
      with:
        path: eng/vectorpdf/corpus/cache
        key: vector-corpus-${{ hashFiles('eng/vectorpdf/corpus/fetch-corpus.ps1', 'eng/vectorpdf/corpus/manifest.json') }}

    - name: Fetch and Verify Corpus
      shell: pwsh
      run: ./eng/vectorpdf/corpus/fetch-corpus.ps1 -Verify

    - name: Build Tool
      run: dotnet build eng/vectorpdf/tools/VectorPdf.Tool/VectorPdf.Tool.csproj --configuration Release

    - name: Corpus Report
      shell: pwsh
      run: dotnet run --project eng/vectorpdf/tools/VectorPdf.Tool/VectorPdf.Tool.csproj --configuration Release --no-build -- corpus eng/vectorpdf/corpus/cache --diff --software --out corpus-report.jsonl --summary corpus-summary.json

    - name: Compare With Baseline
      shell: pwsh
      run: ./eng/vectorpdf/corpus/compare-summary.ps1 -Baseline eng/vectorpdf/baseline-corpus-summary.warp.json -Current corpus-summary.json

    - name: Upload Corpus Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: vector-corpus-${{ github.run_number }}
        path: |
          corpus-summary.json
          corpus-report.jsonl
        retention-days: 90
