name: CI Build, Test & Security Matrix

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  schedule:
    # Nightly tier (07_TEST_CORPUS "CI tiers"): deep fuzzing and the corpus report.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET 9.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore Dependencies
      run: dotnet restore PdfViewer.slnx

    - name: Build Solution (Debug & Release)
      run: |
        dotnet build PdfViewer.slnx --configuration Debug --no-restore
        dotnet build PdfViewer.slnx --configuration Release --no-restore

    - name: Run Viewer Regression Suite & Code Coverage
      run: dotnet test tests/PdfViewer.Tests/PdfViewer.Tests.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

    # The viewer as it is published (M10): built with -p:PdfiumRenderer=false, so PdfEngine.Pdfium
    # is not referenced and the PDFium-free gate tests run against the build that ships. It goes to
    # its own bin\nopdfium and obj\nopdfium folders, so the Release build above is untouched. The
    # test files that need PDFium (the PDFium adapter, PDFium mode) are listed as PdfiumOnlyTest in
    # tests/PdfViewer.Tests/PdfViewer.Tests.csproj and left out; the list, with each file's reason,
    # and the single tests behind #if PDFIUM_RENDERER go to the job summary.
    - name: Run Viewer Suite Without PDFium (published configuration)
      shell: pwsh
      run: |
        $project = [xml](Get-Content tests/PdfViewer.Tests/PdfViewer.Tests.csproj -Raw)
        $excluded = @($project.Project.ItemGroup.PdfiumOnlyTest | Where-Object { $_ })
        # Single tests compiled only with PDFium: a test method inside an #if PDFIUM_RENDERER block.
        $guarded = foreach ($file in Get-ChildItem tests/PdfViewer.Tests -Filter *.cs) {
          $inside = $false; $test = $false
          foreach ($line in Get-Content $file.FullName) {
            if ($line -match '^#if PDFIUM_RENDERER') { $inside = $true }
            elseif ($line -match '^#(else|endif)') { $inside = $false }
            elseif ($inside -and $line -match '^\s+\[(Fact|Theory)') { $test = $true }
            elseif ($test -and $line -match '^\s+public (async Task|void) (\w+)\(') { "$($file.Name): $($Matches[2])"; $test = $false }
          }
        }
        if ($env:GITHUB_STEP_SUMMARY) {
          "### Viewer tests without PDFium: $($excluded.Count) PDFium-only test file(s) left out" >> $env:GITHUB_STEP_SUMMARY
          $excluded | ForEach-Object { "- $($_.Include): $($_.Reason)" } >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "$(@($guarded).Count) PDFium-only test(s) in shared files (#if PDFIUM_RENDERER: PDFium mode, the PDFium adapter, or the live oracle comparison behind a committed golden):" >> $env:GITHUB_STEP_SUMMARY
          $guarded | ForEach-Object { "- $_" } >> $env:GITHUB_STEP_SUMMARY
        }
        dotnet test tests/PdfViewer.Tests/PdfViewer.Tests.csproj --configuration Release -p:PdfiumRenderer=false --verbosity normal
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # Vector engine: unit, fixture, differential (PDFium oracle) and fuzz-regression tests.
    - name: Run Vector Engine Suite
      env:
        VECTOR_FUZZ_ITERATIONS: ${{ github.event_name == 'schedule' && '100000' || '2000' }}
      run: dotnet test tests/PdfEngine.Vector.Tests/PdfEngine.Vector.Tests.csproj --configuration Release --no-build --verbosity normal

    # The web demo's Noto fonts, for the Skia suite's tests that need the real files (NotoFontTests,
    # SubstituteShapingTests). They are never committed: eng/webdemo/noto_fonts.py downloads the
    # release archives pinned in eng/webdemo/noto-fonts.json from github.com/notofonts, checks the
    # size and SHA-256 of each archive and of each file taken from it (a mismatch fails the job),
    # and slices the CJK faces with the pinned fontTools, as the web demo workflow does.
    - name: Cache the Noto archives
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/noto-fonts
        key: noto-fonts-${{ runner.os }}-${{ hashFiles('eng/webdemo/noto-fonts.json') }}

    - name: Build the Noto fonts for the tests
      shell: pwsh
      run: |
        python -I eng/webdemo/noto_fonts.py check
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python -m venv "$env:RUNNER_TEMP/noto-venv"
        $py = Join-Path $env:RUNNER_TEMP 'noto-venv/Scripts/python.exe'
        python -I eng/webdemo/noto_fonts.py requirements | Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP/noto-requirements.txt"
        & $py -m pip install --quiet --disable-pip-version-check --require-hashes --no-deps -r "$env:RUNNER_TEMP/noto-requirements.txt"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $out = Join-Path $env:RUNNER_TEMP 'noto'
        & $py -I eng/webdemo/noto_fonts.py build --cache (Join-Path $HOME '.cache/noto-fonts') --out $out
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "NOTO_FONTS_DIR=$out" >> $env:GITHUB_ENV

    # Portable Skia backend (src/PdfEngine.Vector.Skia): every fixture rendered with Skia and with
    # Direct2D, compared within a per-test pixel budget. The corpus parity report in that project
    # runs only when SKIA_PARITY_CORPUS points at a corpus checkout, so it is skipped here. The
    # Noto tests run with the files built above; NOTO_FONTS_REQUIRED makes a missing folder fail them.
    - name: Run Skia Backend Suite
      env:
        NOTO_FONTS_REQUIRED: '1'
      run: dotnet test tests/PdfEngine.Vector.Skia.Tests/PdfEngine.Vector.Skia.Tests.csproj --configuration Release --no-build --verbosity normal

    # Local-only corpus report (no document leaves the runner). Extend by pointing at a
    # rights-cleared corpus checkout; see eng/vectorpdf/corpus/README.md.
    - name: Vector Corpus Report
      shell: pwsh
      run: |
        dotnet run --project eng/vectorpdf/tools/VectorPdf.Tool/VectorPdf.Tool.csproj --configuration Release --no-build -- corpus samples --out vector-corpus.jsonl --diff
        Get-Content vector-corpus.jsonl

    - name: Vector vs PDFium Benchmarks
      run: dotnet run --project eng/vectorpdf/tools/VectorPdf.Tool/VectorPdf.Tool.csproj --configuration Release --no-build -- bench --pages 10

    - name: Upload Vector Diagnostics
      uses: actions/upload-artifact@v4
      with:
        name: vector-diagnostics
        path: vector-corpus.jsonl

    - name: Run Performance Benchmarks
      run: dotnet run --project benchmarks/PdfViewer.Benchmarks/PdfViewer.Benchmarks.csproj --configuration Release --no-build

    - name: Generate CycloneDX & SPDX SBOMs
      shell: pwsh
      run: ./scripts/generate_sbom.ps1

    # Code signing (eng/signing/README.md): a throwaway self-signed certificate for this run, so
    # every build exercises the signing and verification path. Releases sign with the owner's key.
    - name: Create a throwaway signing certificate
      shell: pwsh
      run: |
        $dir = Join-Path $env:RUNNER_TEMP "signing"
        ./scripts/new_signing_certificate.ps1 -OutputDir $dir -Subject "CN=PDF Viewer CI (throwaway)" -ValidYears 1 -PlainPasswordFile
        "PDFVIEWER_SIGN_PFX=$(Join-Path $dir 'codesign.pfx')" >> $env:GITHUB_ENV

    - name: Verify Release Packaging Script
      id: publish
      shell: pwsh
      run: ./scripts/build_publish.ps1 -DryRun

    # Release gates on the payload the step above staged in publish/app (eng/releasegate/README.md).
    # The PDFium-free gate runs inside the publish step itself (no PDFium file in the payload; the
    # app opens, draws and searches the probe document with PDF_PDFIUM_DISABLED=1), so a payload
    # that fails it stops there. The two below run whenever the publish succeeded, so one failing
    # does not hide the other's numbers.
    - name: Installer Payload Size Gate
      if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
      shell: pwsh
      run: dotnet run --project eng/releasegate/ReleaseGate.Tool/ReleaseGate.Tool.csproj --configuration Release --no-build -- payload --dir publish/app --baseline eng/releasegate/baseline-payload.json --check --out payload-size.json

    - name: Cold-Start Gate
      if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
      shell: pwsh
      run: dotnet run --project eng/releasegate/ReleaseGate.Tool/ReleaseGate.Tool.csproj --configuration Release --no-build -- startup --app publish/app --environment "github windows-latest" --baseline eng/releasegate/baseline-startup.json --check --out startup-timings.json

    - name: Upload Release Gate Measurements
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: release-gates
        path: |
          payload-size.json
          startup-timings.json
          publish/pdfium-free.json
        if-no-files-found: ignore

  # Nightly (and on demand): the rights-cleared corpus (eng/vectorpdf/corpus) against the committed
  # baseline. Files are fetched at pinned commits and hash-verified; nothing is committed and no
  # document leaves the runner. Runners have no GPU, so the baseline is the WARP one.
  corpus:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 9.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Cache Corpus
      uses: actions/cache@v4
      with:
        path: eng/vectorpdf/corpus/cache
        key: vector-corpus-${{ hashFiles('eng/vectorpdf/corpus/fetch-corpus.ps1', 'eng/vectorpdf/corpus/manifest.json') }}

    - name: Fetch and Verify Corpus
      shell: pwsh
      run: ./eng/vectorpdf/corpus/fetch-corpus.ps1 -Verify

    - name: Build Tool
      run: dotnet build eng/vectorpdf/tools/VectorPdf.Tool/VectorPdf.Tool.csproj --configuration Release

    - name: Corpus Report
      shell: pwsh
      run: dotnet run --project eng/vectorpdf/tools/VectorPdf.Tool/VectorPdf.Tool.csproj --configuration Release --no-build -- corpus eng/vectorpdf/corpus/cache --diff --software --out corpus-report.jsonl --summary corpus-summary.json

    - name: Compare With Baseline
      shell: pwsh
      run: ./eng/vectorpdf/corpus/compare-summary.ps1 -Baseline eng/vectorpdf/baseline-corpus-summary.warp.json -Current corpus-summary.json

    - name: Upload Corpus Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: vector-corpus-${{ github.run_number }}
        path: |
          corpus-summary.json
          corpus-report.jsonl
        retention-days: 90
