<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  {% seo %}
  <link rel="icon" type="image/png" href="{{ '/assets/img/app-icon.png' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}" />
  <script>
    // The theme the reader chose last time ("light" or "dark"); no choice follows the system.
    try { var t = localStorage.getItem('site-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) { }
  </script>
</head>
<body class="layout-{{ layout.kind | default: 'page' }}">
  {% include header.html %}
  {{ content }}
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
