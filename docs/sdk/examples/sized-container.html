<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sized container: PDF Viewer embed SDK</title>
    <link rel="stylesheet" href="examples.css" />
    <style>
        /* The container needs a size: the viewer fills it. */
        #viewer { height: 520px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    </style>
</head>
<body>
<header class="example"><h1>Sized container</h1><nav><a href="index.html">All examples</a></nav></header>
<main class="article">
    <p>The report below sits in a box of this article. The toolbar is compact, and the full-screen button shows the viewer on the whole screen.</p>
    <div id="viewer"></div>
    <p id="status" class="status" role="status"></p>
    <p>The text of the article goes on after the viewer.</p>
</main>
<script src="../../demo/pdfviewer-embed.js"></script>
<script src="sample-pdf.js"></script>
<script>
    const status = document.getElementById('status');
    const view = new PdfViewer.View({ divId: 'viewer' });
    view.previewFile({
        content: { arrayBuffer: samplePdf() },
        metaData: { fileName: 'Quarterly report.pdf' },
    }, {
        embedMode: 'SIZED_CONTAINER',
        showFullScreen: true,
        defaultViewMode: 'FIT_PAGE',
    }).then(() => {
        status.textContent = 'Ready.';
    }).catch(error => {
        status.className = 'status error';
        status.textContent = error.code + ': ' + error.message;
    });
</script>
</body>
</html>
